services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cricket_connect_test
      POSTGRES_USER: cricket_test
      POSTGRES_PASSWORD: cricket_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricket_test -d cricket_connect_test"]
      interval: 2s
      timeout: 3s
      retries: 20
